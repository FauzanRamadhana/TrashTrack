[versions]
accompanistPermissions = "0.30.1"
agp = "8.4.2"
kotlin = "1.9.22"  # Perubahan dari 2.1.10 ke 1.9.22
coreKtx = "1.12.0"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
junit = "4.13.2"
junitVersion = "1.1.5"  # Diubah ke versi yang lebih stabil
espressoCore = "3.5.1"  # Diubah ke versi yang lebih stabil
kotlinStdlib = "1.9.22"
kotlinStdlibCommon = "1.9.22"
kotlinReflect = "1.9.22"
lifecycleRuntimeKtx = "2.6.2"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
activityCompose = "1.8.2"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
composeBom = "2023.10.01"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
mapsCompose = "2.11.3"
navigationCompose = "2.7.6"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
playServicesMaps = "18.2.0"  # Diubah ke versi yang lebih stabil
playServicesLocation = "21.0.1"  # Diubah ke versi yang lebih stabil
navigationRuntimeKtx = "2.7.6"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
roomCommonJvm = "2.6.1"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
roomRuntimeAndroid = "2.6.1"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22
workRuntimeKtx = "2.9.0"  # Diubah ke versi yang lebih kompatibel dengan Kotlin 1.9.22

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
firebase-storage-ktx = { module = "com.google.firebase:firebase-storage-ktx" }
firebase-analytics-ktx = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-database-ktx = { module = "com.google.firebase:firebase-database-ktx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinReflect" }
kotlin-stdlib-common = { module = "org.jetbrains.kotlin:kotlin-stdlib-common", version.ref = "kotlinStdlibCommon" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-navigation-runtime-ktx = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigationRuntimeKtx" }
androidx-room-common-jvm = { group = "androidx.room", name = "room-common", version.ref = "roomCommonJvm" }  # Mengubah nama module ke "room-common" (tanpa -jvm)
androidx-room-runtime-android = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntimeAndroid" }  # Mengubah nama module ke "room-runtime" (tanpa -android)

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }